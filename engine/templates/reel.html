<!doctype html>
<html data-theme="evening" style="--logo-url:url('{{{logoUrl}}}'); --monogram-url:url('{{{monogramUrl}}}')">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{{tokensUrl}}}">
<link rel="stylesheet" href="{{{baseCssUrl}}}">
<style>
  /* Reel — a strip of film laid on the walnut table: stacked frames between
     sprocket rails, edge codes in ledger type, the label stamped across. */
  .stage { justify-content: center; gap: 44px; }

  /* The tabletop itself: lamplit wooden boards with visible grain. */
  .bg::before {
    background:
      radial-gradient(115% 85% at 26% 6%, rgba(236, 192, 126, 0.32), transparent 58%),
      radial-gradient(150% 120% at 50% 118%, rgba(10, 5, 2, 0.62), transparent 62%),
      linear-gradient(162deg, #59402a 0%, #4a3320 42%, #33220f 100%);
  }
  .bg::after {
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='wood'><feTurbulence type='fractalNoise' baseFrequency='0.11 0.008' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.12 0 0 0 0 0.07 0 0 0 0 0.03 0 0 0 0.5 0'/></filter><rect width='100%25' height='100%25' filter='url(%23wood)'/></svg>"),
      repeating-linear-gradient(90deg,
        rgba(255, 224, 176, 0.06) 0, rgba(255, 224, 176, 0.06) 2px,
        transparent 2px, transparent 214px,
        rgba(0, 0, 0, 0.42) 214px, rgba(0, 0, 0, 0.42) 217px),
      repeating-linear-gradient(90deg,
        rgba(0, 0, 0, 0.10) 0, rgba(0, 0, 0, 0.10) 108px,
        transparent 108px, transparent 217px);
    opacity: 1;
  }

  .reel-wrap { position: relative; display: flex; justify-content: center; }
  .reel {
    position: relative;
    width: 80%;
    background: #0b0705;
    border-radius: 4px;
    padding: 0 58px;
    box-shadow:
      inset 0 1px 0 rgba(232, 196, 138, 0.05),
      0 34px 90px -30px rgba(0, 0, 0, 0.85),
      0 8px 24px -10px rgba(0, 0, 0, 0.6);
    transform: rotate(-1.6deg);
  }
  /* Sprocket rails — punched holes running down both edges. */
  .reel::before, .reel::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 58px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='58' height='56'><rect x='14' y='17' width='30' height='22' rx='5' fill='%23201409'/></svg>");
    background-repeat: repeat-y;
    background-position: center;
  }
  .reel::before { left: 0; }
  .reel::after { right: 0; }

  .reel-leader {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 6px;
  }
  .reel-leader span {
    font-family: var(--atelier-sans);
    font-size: 13px; font-weight: 500;
    letter-spacing: var(--track-caps-md);
    text-transform: uppercase;
    color: rgba(184, 151, 106, 0.75);
    white-space: nowrap;
  }
  .reel-frame { position: relative; }
  .reel-frame img {
    display: block; width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .reel-seam { height: 38px; }
  .reel-seam.with-label { height: 92px; }

  /* The label stamps straight across the tilted strip. */
  .reel-label {
    position: absolute; z-index: 20;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-family: var(--atelier-sans);
    font-size: 26px; font-weight: 500;
    letter-spacing: var(--track-caps-xhi);
    text-indent: 0.34em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--atelier-cream);
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.75), 0 0 2px rgba(0, 0, 0, 0.5);
  }
  header { display: flex; justify-content: center; }
</style>
</head>
<body class="canvas {{formatClass}}">
<div class="bg"></div>
<main class="stage">
  <header>
    <div class="pp-wordmark" style="width: 218px" role="img" aria-label="Private Pattern"></div>
  </header>
  <div class="reel-wrap">
    <div class="reel">
      <div class="reel-leader"><span>Private Pattern ✻ 120</span><span>№ 01</span></div>
      {{{reelFrames}}}
      <div class="reel-leader"><span>Crafted in Vietnam</span><span>№ {{reelLast}}</span></div>
    </div>
    {{#markLabel}}<div class="reel-label">{{markLabel}}</div>{{/markLabel}}
  </div>
</main>
<div class="grain"></div>
</body>
</html>
